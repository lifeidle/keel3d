name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run bundle:report
      - name: Browser probe (all skeleton entries)
        env:
          KEEL_PROBE_BROWSER: chromium
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --host &
          sleep 8
          node scripts/probe-all.mjs http://127.0.0.1:4173
