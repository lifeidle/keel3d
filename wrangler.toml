# Cloudflare Pages — direct upload config.
# Deploy with:  wrangler pages deploy dist
# (requires `wrangler login` first, or CLOUDFLARE_API_TOKEN in the env)
name = "night-raid"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-01"

# NOTE: this project ships @dimforge/rapier3d-COMPAT. Its WASM is inlined as
# base64, so it runs WITHOUT cross-origin isolation (no SharedArrayBuffer).
# That means no COOP/COEP headers are required — _headers already ships the
# security headers we want and intentionally leaves isolation off.

# --- Multiplayer signaling (stage 1, free plan) ---
# Pages Functions read/write offers & answers via this KV namespace.
# Create the namespace once:  wrangler kv namespace create NET_SIGNALING
# then put its id below (local dev with `wrangler pages dev` auto-mocks it).
[[kv_namespaces]]
binding = "NET_SIGNALING"
id = "5c768f82f6da4c4c8fdc44b17128d358"
