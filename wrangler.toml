# Cloudflare Pages — direct upload config.
# Deploy: wrangler pages deploy dist
# (wrangler login first, or CLOUDFLARE_API_TOKEN in the env)
name = "keel3d"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-01"

# Optional multiplayer signaling (Pages Functions + KV).
# Create a namespace in your own Cloudflare account, then set the id here.
# Local dev with `wrangler pages dev` mocks signaling without KV.
# [[kv_namespaces]]
# binding = "NET_SIGNALING"
# id = "<your-kv-namespace-id>"
